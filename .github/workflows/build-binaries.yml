name: Build Executables

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-server:
    name: server-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            target: windows-amd64
          - name: windows-arm64
            os: windows-latest
            target: windows-arm64
          - name: linux-amd64
            os: ubuntu-latest
            target: linux-amd64
          - name: linux-arm64
            os: ubuntu-latest
            target: linux-arm64
          - name: macos-amd64
            os: macos-latest
            target: macos-amd64
          - name: macos-arm64
            os: macos-latest
            target: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web + server bundle
        run: npm run build

      - name: Package SEA executable
        shell: bash
        run: |
          node scripts/package-server-sea.mjs --target "${{ matrix.target }}" --outdir dist-bin
          ls -lh dist-bin

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: |
            dist-bin/ai-todo-server-${{ matrix.target }}*
          if-no-files-found: error

      - name: Attach server artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist-bin/ai-todo-server-${{ matrix.target }}*

  build-desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-todo-desktop-windows-amd64.exe
            binary: ai-todo-desktop.exe
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ai-todo-desktop-linux-amd64
            binary: ai-todo-desktop
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ai-todo-desktop-macos-arm64
            binary: ai-todo-desktop
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ai-todo-desktop-macos-amd64
            binary: ai-todo-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked --force

      - name: Build desktop executable
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          mkdir -p ../../dist
          cargo tauri build --target "${{ matrix.target }}" --verbose
          src="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [[ ! -f "$src" ]]; then
            echo "Missing binary: $src" >&2
            ls -la "target/${{ matrix.target }}/release" || true
            exit 1
          fi
          cp "$src" "../../dist/${{ matrix.artifact }}"
          chmod +x "../../dist/${{ matrix.artifact }}" || true
          ls -lh "../../dist/${{ matrix.artifact }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/${{ matrix.artifact }}
