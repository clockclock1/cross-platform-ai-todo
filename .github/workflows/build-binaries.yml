name: Build Executables

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ai-todo-desktop-windows-amd64
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ai-todo-desktop-windows-arm64
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ai-todo-desktop-linux-amd64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ai-todo-desktop-linux-arm64
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ai-todo-desktop-macos-amd64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ai-todo-desktop-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked --force

      - name: Build desktop executable
        shell: bash
        working-directory: desktop/src-tauri
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          mkdir -p ../../dist
          cargo tauri build --target "${{ matrix.target }}" --verbose --bundles app
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            artifact=$(find "$bundle_dir" -name '*.exe' | head -n 1)
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            artifact=$(find "$bundle_dir" -name '*.app' -o -name '*.dmg' | head -n 1)
          else
            artifact=$(find "$bundle_dir" -type f -executable | head -n 1)
          fi
          if [[ -z "$artifact" ]]; then
            echo "No bundle artifact found under $bundle_dir" >&2
            find "$bundle_dir" || true
            exit 1
          fi
          cp -R "$artifact" "../../dist/${{ matrix.artifact }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/${{ matrix.artifact }}
